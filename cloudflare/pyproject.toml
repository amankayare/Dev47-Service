description = "Cloudflare Workers host adapter for the Dev47 Service"
requires-python = ">=3.13"
dependencies = [
    "dev47-backend-core",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv.sources]
dev47-backend-core = { path = "../backend_core" }
